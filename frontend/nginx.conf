# Konteyner ichidagi nginx: statik fayllar + /api va /uploads -> API konteyneri.
# X-Forwarded-For host nginx'dan kelgan qiymat bilan o'zgarishsiz uzatiladi (u yerda mijoz IP'si yoziladi).
server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /uploads/ {
        proxy_pass http://api:8080;
        expires 30d;
    }

    # Vite build fayllari nomida hash bor — uzoq keshlash xavfsiz
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
