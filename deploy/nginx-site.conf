# Host nginx: /etc/nginx/sites-available/nybarber -> 127.0.0.1:8082 (web konteyneri).
# HTTPS qismini certbot --nginx o'zi qo'shadi.
server {
    listen 80;
    server_name nybarber.bunyodmusayev.uz;
    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        # Mijoz yuborgan sarlavha emas — faqat haqiqiy IP (soxtalashtirib bo'lmaydi)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
